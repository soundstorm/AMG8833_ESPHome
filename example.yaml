esphome:
  name: amg8833-door1      # second door: amg8833-door2

esp32:
  board: esp32dev

logger:
api:
  homeassistant_services: true   # lets the device call Home Assistant actions (also allow it in HA for this device)
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Test locally:  source: { type: local, path: components }
# From GitHub:   source: github://soundstorm/AMG8833_ESPHome@main
external_components:
  - source:
      type: local
      path: components

i2c:
  sda: GPIO21
  scl: GPIO22

amg8833:
  id: amg
  address: 0x69            # 0x68 if AD_SELECT is tied to GND
  update_interval: 100ms   # 10 fps
  temperature:
    name: "AMG8833 Sensor Temperature"
  max_temperature:
    name: "AMG8833 Hottest Pixel"
  presence:
    name: "Person in View"
  frame:                   # 64 pixels as hex string (128 characters)
    name: "AMG8833 Frame"
  log_frames: false        # diagnostics: one DEBUG line per frame (needs logger level DEBUG), see tools/parse_log.py
  frame_min_temperature: 15
  frame_max_temperature: 35
  frame_interval: 1s
  image_endpoint:          # optional, every part can be switched off
    bmp: true              # http://<ip>/thermal.bmp  (for the HA "Generic Camera" integration)
    svg: false             # http://<ip>/thermal.svg
    viewer: true           # http://<ip>/thermal      (live view in the browser)
    scale: 8               # BMP edge length = 8 * scale pixels (8 -> 64x64)
  people_counter:
    axis: columns          # walking direction through the door: columns or rows
    invert: false          # true if entering and leaving are swapped
    warm_delta: 2.0        # °C above the learned background
    min_pixels: 3
    min_travel: 2.0        # pixels of travel required to count as a crossing
    release_frames: 3
    background_rate: 0.005       # how fast the background follows slow temperature changes (0 = never)
    auto_recalibrate_after: 2min # relearn if "presence" lasts this long (0s = off)
    # Shared counter in Home Assistant, used by several doors
    # (see homeassistant/people_in_room.yaml). For every further door only change
    # the device name, I2C pins and, if needed, `invert`.
    on_enter:
      - homeassistant.action:
          action: counter.increment
          data:
            entity_id: counter.people_in_room
    on_exit:
      - homeassistant.action:
          action: counter.decrement
          data:
            entity_id: counter.people_in_room

# Relearn the empty room on demand, e.g. nightly or when the room is locked.
# Press it from Home Assistant automations. The room should be empty.
button:
  - platform: template
    name: "AMG8833 Recalibrate"
    on_press:
      - amg8833.recalibrate: amg
